# Spec 007: on a tag like v1.2.3, build signed MSIX + portable zip for x64 and ARM64 and publish a GitHub Release.
# Needs two repository secrets (see tools\New-SigningCert.ps1): SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test -c Release --filter "Category!=Integration&Category!=Probe"

      - name: Signing key
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { throw 'Secret SIGNING_PFX_BASE64 is missing (see tools\New-SigningCert.ps1).' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Build release files
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./tools/Publish-Release.ps1 -Version '${{ github.ref_name }}' -PfxPath $env:SIGNING_PFX -PfxPassword $env:SIGNING_PFX_PASSWORD

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: if ($env:SIGNING_PFX) { Remove-Item $env:SIGNING_PFX -Force -ErrorAction SilentlyContinue }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content tools/release-notes.md -Raw
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts -File).FullName --title 'CartonStash ${{ github.ref_name }}' --notes $notes
