# Spec 007: on a tag like v1.2.3, build MSIX + portable zip for x64 and ARM64, sign them and publish a GitHub Release.
# Build code and the signing key never run together (R5.1): `build` has no secrets and `release` never runs dotnet.
# The signing job reads two secrets (see tools\New-SigningCert.ps1): SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got '$env:TAG')." }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test -c Release --filter "Category!=Integration&Category!=Probe"

      - name: Build release files
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/Publish-Release.ps1 -Version $env:TAG

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      # The signing script and release notes only: nothing here restores or builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: artifacts

      - name: Sign
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64) { throw 'Secret SIGNING_PFX_BASE64 is missing (see tools\New-SigningCert.ps1).' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
              ./tools/Sign-Release.ps1 -PfxPath $pfx -PfxPassword $env:SIGNING_PFX_PASSWORD
          }
          finally {
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = Get-Content tools/release-notes.md -Raw
          gh release create $env:TAG (Get-ChildItem artifacts -File).FullName --verify-tag --title "CartonStash $env:TAG" --notes $notes

  # Its own job so it can be re-run alone: GitHub refuses attestations on a private repo on the free plan.
  attest:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: artifacts

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
