# Spec 007: on a tag like v1.2.3, build the Microsoft Store MSIX and publish a GitHub Release with the changelog and no
# files (R9.2). The maintainer uploads the store artifact in Partner Center. Neither job holds a secret (R9.8).
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got '$env:TAG')." }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the changelog
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/Get-Changelog.ps1 -Version $env:TAG | Out-Null

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test -c Release --filter "Category!=Integration&Category!=Probe"

      - name: Build release files
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/Publish-Release.ps1 -Version $env:TAG

      # The maintainer uploads these in Partner Center; Microsoft signs them (R6.3).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store
          path: store/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      # The changelog only: nothing here restores or builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          ./tools/Get-Changelog.ps1 -Version $env:TAG | Set-Content $notes
          gh release create $env:TAG --verify-tag --title "CartonStash $env:TAG" --notes-file $notes
