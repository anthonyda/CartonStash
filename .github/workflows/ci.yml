# Spec 007 R3.1: build and unit tests on every push and pull request.
# Integration tests (Category=Integration) need a live WinGet with network and are not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test -c Release --no-build --filter "Category!=Integration&Category!=Probe"
